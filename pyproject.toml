[project]
name = "qa-api-python"
version = "1.0.0"
description = "Testes de API (BDD + API Clients) contra a restful-booker demo API"
requires-python = ">=3.12"
authors = [{ name = "ThomasTDS" }]
license = "ISC"

dependencies = ["requests>=2.32", "pydantic>=2.9"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
    "pytest-rerunfailures>=15.0",
    "pytest-xdist>=3.8",
    "allure-pytest-bdd>=2.16",
    "pytest-cov>=6.0",
    "requests-mock>=1.12",
    "hypothesis>=6.170",
    "pip-audit>=2.7",
    "ruff>=0.14",
    "mypy>=1.14",
    "types-requests>=2.32",
    "pre-commit>=4.0",
]
# Teste de mutação. Fica separado do dev porque o mutmut só roda em sistemas
# com fork (Linux, macOS ou WSL): ele roda no CI, no workflow mutation.yml.
mutation = [
    "mutmut>=3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "models*"]

[tool.pytest.ini_options]
testpaths = ["steps", "tests"]
addopts = "--strict-markers --reruns 1 --alluredir=reports/allure-results --clean-alluredir --cov=api --cov=models --cov-report=term-missing --cov-report=xml:reports/coverage.xml"
# O retry só vale para falhas de rede (conexão recusada ou timeout), que são
# instabilidade da API pública. Falha de asserção ou de schema nunca é
# repetida, para que um bug intermitente não passe na segunda tentativa.
only_rerun = ["^(ConnectionError|ConnectTimeout|ReadTimeout):"]
# Nos testes unitários, o requests-mock compara o endereço exatamente, com
# maiúsculas e minúsculas: um caminho errado como "/BOOKING" precisa falhar
# (achado pelo teste de mutação).
requests_mock_case_sensitive = true
# Os marcadores TC-XXX são registrados no conftest.py, a partir das tags dos
# arquivos .feature. Com --strict-markers, uma tag com erro de digitação
# quebra a coleta em vez de virar só um aviso.
markers = [
    "smoke: fluxos ponta-a-ponta mais críticos (pytest -m smoke)",
    "seguranca: testes de segurança leves, baseados no OWASP API Security Top 10 (pytest -m seguranca)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["reports"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

# Teste de mutação (mutmut): altera o código de api/ e models/ e confere se os
# testes unitários percebem cada alteração. Os testes de documentação ficam de
# fora, porque não exercitam esse código.
[tool.mutmut]
source_paths = ["api/", "models/"]
pytest_add_cli_args_test_selection = [
    "tests/unit/",
    "--ignore=tests/unit/test_traceability.py",
    "--ignore=tests/unit/test_translation_sync.py",
]
pytest_add_cli_args = ["--no-cov", "--hypothesis-profile=mutacao"]
also_copy = ["conftest.py", "steps/", "features/"]

