version: 2
updates:
  # Patch e minor de cada ecossistema chegam juntos num PR só por semana, o
  # que reduz as execuções do CI. Majors continuam em PRs separados, para
  # revisão manual.
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dependencias:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        update-types: ['minor', 'patch']

  # Imagem da restful-booker local (docker-compose.yml). Ela só publica a tag
  # "latest", então a atualização é uma troca de digest, sem versão semver:
  # o auto-merge não se aplica e o PR passa por revisão manual, o que é o
  # desejado, já que uma versão nova da API pode mudar o comportamento testado.
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'

  # Allure 3, a única dependência Node do projeto (package.json).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm:
        update-types: ['minor', 'patch']
