name: API Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'
  # Disparo manual: roda a mesma verificação da execução diária, contra a API
  # pública. "simular_falha" força uma falha, para conferir que a issue de
  # acompanhamento abre e fecha como deveria.
  workflow_dispatch:
    inputs:
      simular_falha:
        description: 'Simular uma falha (para validar a issue de acompanhamento)'
        type: boolean
        default: false

permissions:
  contents: read

# O "uv sync --locked" de cada job já instala tudo a partir do uv.lock; com
# UV_NO_SYNC, os "uv run" seguintes usam esse ambiente sem tentar ajustá-lo.
env:
  UV_NO_SYNC: '1'

jobs:
  # Checagens que não dependem da API pública: tipos, lint, formatação,
  # dependências vulneráveis e testes unitários (com requests-mock, sem rede).
  # Rodam em segundos e, se falharem, a integração nem chega a rodar.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked: instala exatamente o que está no uv.lock e falha se o lock
      # estiver desatualizado em relação ao pyproject.toml.
      - name: Instalar dependências
        run: uv sync --locked --extra dev

      - name: Checar tipos
        run: uv run mypy .

      - name: Lint
        run: uv run ruff check .

      - name: Verificar formatação
        run: uv run ruff format --check .

      - name: Auditar dependências
        run: uv run pip-audit --skip-editable

      # O perfil ci do Hypothesis gera 1000 exemplos por teste de propriedade.
      - name: Rodar testes unitários
        run: uv run pytest tests/unit --no-cov --hypothesis-profile=ci

  # Suíte completa contra a restful-booker. Roda também os unitários de novo
  # (custam milissegundos) para que o relatório e a cobertura continuem
  # cobrindo o projeto inteiro. Uma falha aqui com o job unit verde indica
  # problema na API ou num cenário, não no código dos clients.
  #
  # PRs e pushes usam uma restful-booker local (docker-compose.yml), com a
  # versão fixada: o resultado não depende do Heroku estar no ar nem de dados
  # alterados por terceiros. A execução diária usa a API pública, para
  # perceber quando o comportamento dela mudar.
  integration:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    env:
      BASE_URL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'https://restful-booker.herokuapp.com' || 'http://localhost:3001' }}
      # Limite de tempo de cada resposta: 3 s na API pública, 500 ms na local.
      RESPONSE_TIME_LIMIT_MS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '3000' || '500' }}
      # Contra a API pública, os testes rodam em 4 processos (pytest-xdist): a
      # suíte cai de cerca de 1 min 47 s para 32 s. Quatro, e não um por núcleo,
      # para limitar as requisições simultâneas numa API que é compartilhada.
      # Contra a API local, os cenários levam menos de 1 s (o resto do tempo
      # vem dos testes de propriedade), e o ganho do paralelo seria pequeno.
      PYTEST_ADDOPTS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '-n 4' || '' }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Instalar uv e Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked: instala exatamente o que está no uv.lock e falha se o lock
      # estiver desatualizado em relação ao pyproject.toml.
      - name: Instalar dependências
        run: uv sync --locked --extra dev

      - name: Simular falha
        if: inputs.simular_falha
        run: |
          echo "Falha simulada pelo disparo manual, para validar a issue de acompanhamento"
          exit 1

      # O container leva alguns segundos para começar a responder; o /ping
      # devolve 201 quando a API está pronta.
      - name: Subir a restful-booker local
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/ping")" = "201" ]; then
              echo "API pronta em $BASE_URL"
              exit 0
            fi
            sleep 2
          done
          echo "A API local não respondeu em 60 segundos"
          docker compose logs
          exit 1

      - name: Rodar testes
        run: uv run pytest

      # Cobertura, relatório HTML e Pages só precisam de uma versão do Python
      # gerando o artifact — rodar pras duas duplicaria o upload à toa.
      - name: Enviar cobertura para o Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: reports/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Relatório Allure 3 (ferramenta Node, versão travada no package-lock.json).
      - name: Instalar Node
        if: always() && matrix.python-version == '3.12'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Relatório para o artifact da execução (o de PR é o mais usado). O que
      # vai para o Pages é gerado no job deploy-pages, a partir dos mesmos
      # resultados, para usar o histórico mais recente.
      - name: Gerar relatório Allure
        if: always() && matrix.python-version == '3.12'
        run: |
          npm ci --no-audit --no-fund
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.jsonl" \
            -o reports/history.jsonl || echo "Sem histórico publicado ainda"
          npm run report

      - name: Publicar relatório Allure
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: reports/allure-report
          retention-days: 15

      - name: Guardar os resultados para o GitHub Pages
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 1

  # Acompanhamento da execução diária (e do disparo manual), que roda contra a
  # API pública: na falha, abre uma issue com o rótulo execucao-diaria, ou
  # comenta nela se já estiver aberta; quando volta a passar, comenta e fecha.
  # Assim uma falha não passa dias despercebida, como aconteceu em outubro.
  acompanhar-execucao-diaria:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [unit, integration]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir, comentar ou fechar a issue de acompanhamento
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTADO_UNIT: ${{ needs.unit.result }}
          RESULTADO_INTEGRATION: ${{ needs.integration.result }}
          SIMULADA: ${{ inputs.simular_falha }}
        run: |
          LABEL=execucao-diaria
          DATA=$(date -u '+%d/%m/%Y %H:%M UTC')
          gh label create "$LABEL" --color D93F0B --description "Falha na execução diária contra a API pública" --force
          ISSUE=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')

          if [ "$RESULTADO_UNIT" = "success" ] && [ "$RESULTADO_INTEGRATION" = "success" ]; then
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "Voltou a passar em $DATA: $RUN_URL"
              gh issue close "$ISSUE"
            fi
            exit 0
          fi

          DETALHE="Falhou em $DATA (unit: $RESULTADO_UNIT, integration: $RESULTADO_INTEGRATION): $RUN_URL"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$DETALHE"
            exit 0
          fi

          TITULO="Execução diária contra a API pública falhando"
          if [ "$SIMULADA" = "true" ]; then
            TITULO="[Validação] $TITULO (falha simulada)"
          fi
          {
            echo "$DETALHE"
            echo
            echo "Verificar se é uma mudança de comportamento da API pública ou um problema do projeto (ver a seção 6 de docs/test-strategy.md)."
            echo
            echo "Esta issue fecha sozinha na próxima execução diária que passar."
          } > corpo.md
          gh issue create --title "$TITULO" --label "$LABEL" --assignee "$GITHUB_REPOSITORY_OWNER" --body-file corpo.md

  # Gera o relatório do Pages e publica. Dois merges seguidos disparam duas
  # publicações, e o grupo de concorrência faz a segunda esperar a primeira.
  # Baixar o histórico, gerar o relatório e publicar ficam todos aqui dentro,
  # para que a segunda publicação parta do histórico que a primeira acabou de
  # publicar; se o histórico fosse baixado antes, no job de integração, as duas
  # baixariam o mesmo e a segunda apagaria a linha da primeira.
  deploy-pages:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: integration
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Baixar os resultados do Allure
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: reports/allure-results

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # Na primeira publicação o histórico ainda não existe, e o relatório
      # começa um novo.
      - name: Gerar relatório Allure com o histórico publicado
        run: |
          npm ci --no-audit --no-fund
          curl -sfL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.jsonl" \
            -o reports/history.jsonl || echo "Sem histórico publicado ainda"
          npm run report
          mkdir -p pages
          cp reports/allure-report/index.html pages/index.html
          cp reports/history.jsonl pages/history.jsonl

      - name: Empacotar artifact do GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
